<header class="site-header">
  <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
  <nav class="site-nav">
    <a href="https://sabriaydin.github.io/">Siteye Dön</a>
    <a href="{{ '/' | relative_url }}">Ana Sayfa</a>
    
    <!-- Örnek Açılır Menü -->
    <div class="dropdown">
      <a href="javascript:void(0)" class="dropbtn">Kategoriler &#9662;</a>
      <div class="dropdown-content">
        <a href="#">Bilişim Sistemleri</a>
        <a href="#">Altyapı</a>
        <a href="#">Güncel Teknolojiler</a>
      </div>
    </div>

    <a href="{{ '/hakkimda' | relative_url }}">Hakkımda</a>
    
    <!-- Arama Butonu ve Kutusu -->
    <div class="search-container">
      <button class="search-icon" onclick="toggleSearch()" title="Sitede Ara">
        <!-- Modern SVG Arama İkonu -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <div class="search-box" id="searchBox">
        <input type="text" id="searchInput" onkeyup="performSearch()" placeholder="Yazılarda ara...">
        <ul id="searchResults"></ul>
      </div>
    </div>
  </nav>
</header>
