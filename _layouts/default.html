<!-- _layouts/default.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <!-- Stil dosyamızı bağlıyoruz (Eski bağ oluşturucu yerinde bırakıldı) -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <!-- KESİN ÇÖZÜM: Tasarımı doğrudan sayfaya gömüyoruz -->
  <style>
    body {
      background-color: #1e2127; 
      color: #abb2bf; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .site-header {
      background-color: #181a1f;
      padding: 20px 0;
      border-bottom: 2px solid #282c34;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .site-title {
      margin: 0;
      font-size: 1.5rem;
    }
    .site-title a {
      color: #61afef; 
      text-decoration: none;
      font-weight: bold;
    }
    .site-nav a {
      color: #5c6370;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 500;
    }
    .site-nav a:hover {
      color: #98c379;
    }
    main {
      padding: 40px 0;
      min-height: 60vh;
    }
    a {
      color: #61afef;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .post-summary {
      background-color: #21252b;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 4px;
      border: 1px solid #282c34;
      border-left: 4px solid #61afef;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .post-summary h2 {
      margin-top: 0;
      margin-bottom: 10px;
    }
    .post-summary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
      border-left: 4px solid #98c379;
    }
    .post-meta {
      font-size: 0.85em;
      color: #5c6370;
      display: block;
      margin-bottom: 15px;
      font-family: monospace;
    }
    .pagination {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-page {
      background-color: #282c34;
      color: #abb2bf;
      padding: 10px 20px;
      border-radius: 4px;
      border: 1px solid #3e4451;
      transition: all 0.2s ease;
    }
    .btn-page:hover {
      background-color: #61afef;
      color: #282c34;
      text-decoration: none;
    }
    .btn-page.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-page.disabled:hover {
      background-color: #282c34;
      color: #abb2bf;
    }
    .site-footer {
      text-align: center;
      padding: 25px 0;
      background-color: #181a1f;
      border-top: 1px solid #282c34;
      font-size: 0.9em;
      color: #5c6370;
    }
    pre, code {
      background-color: #282c34;
      color: #98c379;
      border-radius: 4px;
      font-family: "Fira Code", Consolas, Monaco, monospace;
      padding: 2px 4px;
    }
    pre {
      padding: 15px;
      overflow-x: auto;
      border: 1px solid #3e4451;
      border-left: 4px solid #e06c75;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
  </style>
  
  <!-- SEO Etiketleri -->
  {% seo %}
</head>
<body>
  
  <header class="site-header">
    <div class="container">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <nav class="site-nav">
        <!-- İleride buraya Hakkımda, İletişim gibi sayfalar eklenebilir -->
        <a href="{{ '/hakkimda' | relative_url }}">Hakkımda</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Sayfa ve yazı içerikleri buraya yüklenecek -->
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Tüm hakları saklıdır.</p>
    </div>
  </footer>

</body>
</html>
