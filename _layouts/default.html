<!-- _layouts/default.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <!-- Stil dosyamızı mutlak yol ve önbellek kırıcı ile bağlıyoruz -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | absolute_url }}?v={{ site.time | date: '%s' }}">
  <!-- SEO Etiketleri -->
  {% seo %}
</head>
<body>
  
  <header class="site-header">
    <div class="container">
      <h1 class="site-title"><a href="{{ '/' | absolute_url }}">{{ site.title }}</a></h1>
      <nav class="site-nav">
        <!-- İleride buraya Hakkımda, İletişim gibi sayfalar eklenebilir -->
        <a href="{{ '/hakkimda/' | absolute_url }}">Hakkımda</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Sayfa ve yazı içerikleri buraya yüklenecek -->
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Tüm hakları saklıdır.</p>
    </div>
  </footer>

</body>
</html>
