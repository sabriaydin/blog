<!-- _layouts/default.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg-color: #0f172a;        /* Derin modern koyu arkaplan (Gece Mavisi/Gri) */
      --card-bg: #1e293b;         /* Kartlar için tok koyu ton */
      --text-main: #f8fafc;       /* Tertemiz okunabilir beyaz */
      --text-muted: #94a3b8;      /* İkincil gri metinler */
      --accent: #38bdf8;          /* Canlı bilişim mavisi */
      --border: #334155;          /* Şık sınır çizgileri */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.7;
      margin: 0;
      padding: 0;
    }

    /* Header'ı ekran geneline yayan ve başlığı sol, menüyü sağ kenara sabitleyen yapı */
    .site-header {
      background-color: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
    }

    .site-header .container {
      max-width: 100% !important; /* Sınırlamayı kaldırıp tam genişlik yapıyoruz */
      padding: 0 20px !important; /* Ekran kenarlarına tam yaslanması için boşluk daraltıldı */
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
    }

    .site-title {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .site-title a {
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.01em;
    }

    .site-title a:hover {
      color: var(--accent);
    }

    .site-nav {
      display: flex;
      gap: 30px;
    }

    .site-nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .site-nav a:hover {
      color: var(--accent);
    }

    /* Ana İçerik Alanı */
    main.container {
      max-width: 820px;
      margin: 0 auto;
      padding: 50px 20px;
      min-height: 75vh;
    }

    /* Bilişim Tarzı Şık Kartlar */
    .post-summary {
      background-color: var(--card-bg);
      padding: 35px;
      margin-bottom: 30px;
      border-radius: 12px;
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .post-summary:hover {
      transform: translateY(-3px);
      border-color: #475569;
    }

    .post-summary h2 {
      margin: 0 0 12px 0;
      font-size: 1.5rem;
    }

    .post-summary h2 a {
      color: var(--text-main);
      text-decoration: none;
    }

    .post-summary h2 a:hover {
      color: var(--accent);
    }

    .post-meta {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--accent);
      background-color: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 16px;
    }

    .post-summary p {
      margin: 0;
      color: var(--text-muted);
    }

    /* Sayfalama */
    .pagination {
      margin-top: 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 25px;
    }

    .btn-page {
      background-color: var(--card-bg);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-weight: 500;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-page:hover:not(.disabled) {
      background-color: #334155;
      color: var(--accent);
    }

    .btn-page.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-number {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Footer */
    .site-footer {
      text-align: center;
      padding: 30px 0;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.85rem;
      background-color: rgba(15, 23, 42, 0.5);
    }

    a {
      color: var(--accent);
    }
    
    /* --- Tekil Yazı Sayfası (Post) Eklemeleri --- */
    .post {
      background-color: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .post-header {
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .post-title {
      margin: 0 0 10px 0;
      font-size: 2.2rem;
      color: var(--text-main);
    }

    .post-content {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .post-content h1, .post-content h2, .post-content h3 {
      color: var(--text-main);
      margin-top: 30px;
    }
    
    .post-content ul, .post-content li {
      margin-bottom: 10px;
    }
  </style>
  
  {% seo %}
</head>
<body>
  
  <header class="site-header">
    <div class="container">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <nav class="site-nav">
        <a href="{{ '/hakkimda' | relative_url }}">Hakkımda</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Tüm hakları saklıdır.</p>
    </div>
  </footer>

</body>
</html>
