<!-- _layouts/default.html -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <!-- Stil dosyamızı bağlıyoruz -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <!-- SİL BAŞTAN YARATILAN PREMIUM TASARIM -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    body {
      background-color: #f3f4f6; /* Modern açık gri arka plan */
      color: #1f2937;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Simetrik ve Temiz Header */
    .site-header {
      background-color: #ffffff;
      padding: 16px 0;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .site-header .container {
      display: flex;
      justify-content: space-between; /* Başlık sola, menü sağa tam yaslı */
      align-items: center;
    }

    .site-title {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .site-title a {
      color: #111827;
      text-decoration: none;
    }

    .site-nav {
      display: flex;
      gap: 24px; /* Menü elemanları arası net boşluk */
    }

    .site-nav a {
      color: #4b5563;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }

    .site-nav a:hover {
      color: #2563eb; /* Premium mavi vurgu */
    }

    main {
      padding: 60px 0;
      min-height: 70vh;
    }

    /* Bembeyaz ve Derinlikli İçerik Kartları */
    .post-summary {
      background-color: #ffffff;
      padding: 40px;
      margin-bottom: 32px;
      border-radius: 16px; /* Modern yuvarlak köşeler */
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      border: 1px solid #f3f4f6;
      border-left: 6px solid #2563eb; /* Şık sol ayraç */
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .post-summary:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .post-summary h2 {
      margin: 0 0 12px 0;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .post-summary h2 a {
      color: #1f2937;
      text-decoration: none;
    }

    .post-summary h2 a:hover {
      color: #2563eb;
    }

    .post-meta {
      display: inline-block;
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 16px;
      font-weight: 500;
      background-color: #f3f4f6; /* Tarih için hap (pill) tasarımı */
      padding: 4px 12px;
      border-radius: 20px;
    }

    .post-summary p {
      margin: 0;
      color: #4b5563;
      font-size: 1.05rem;
    }

    /* Sayfalama */
    .pagination {
      margin-top: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-page {
      background-color: #ffffff;
      color: #374151;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-page:hover:not(.disabled) {
      border-color: #2563eb;
      color: #2563eb;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.1);
    }

    .btn-page.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background-color: #f9fafb;
    }

    .page-number {
      font-size: 0.9rem;
      font-weight: 600;
      color: #6b7280;
    }

    /* Daraltılmış ve Sade Footer */
    .site-footer {
      text-align: center;
      padding: 24px 0;
      border-top: 1px solid #e5e7eb;
      color: #9ca3af;
      font-size: 0.875rem;
    }

    a {
      color: #2563eb;
    }
  </style>
  
  <!-- SEO Etiketleri -->
  {% seo %}
</head>
<body>
  
  <header class="site-header">
    <div class="container">
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <nav class="site-nav">
        <!-- İleride buraya Hakkımda, İletişim gibi sayfalar eklenebilir -->
        <a href="{{ '/hakkimda' | relative_url }}">Hakkımda</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Sayfa ve yazı içerikleri buraya yüklenecek -->
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Tüm hakları saklıdır.</p>
    </div>
  </footer>

</body>
</html>
